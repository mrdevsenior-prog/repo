import org.gradle.testing.jacoco.tasks.JacocoReport
import org.gradle.testing.jacoco.tasks.JacocoCoverageVerification

allprojects {
    plugins.withId('java') {
        apply plugin: 'jacoco'
        jacoco { toolVersion = '0.8.16' }
        tasks.withType(Test).configureEach {
            jacoco { includes = ['pe.com.scotiabank.tapp.*'] }
        }

        tasks.register('unitTest', Test) {
            group = 'verification'
            description = 'Pruebas unitarias sin suites de integración ni arquitectura'
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            useJUnitPlatform()
            exclude '**/*IntegrationTest.class', '**/*ArchitectureTest.class'
            testLogging { events 'failed'; exceptionFormat = 'full' }
        }
    }
}

def unitCoverageClasses = files(provider { allprojects.collect { it.sourceSets.main.output.classesDirs } })
def unitCoverageSources = files(provider { allprojects.collect {
    [it.sourceSets.main.allSource.srcDirs, it.layout.buildDirectory.dir('generated/sources/annotationProcessor/java/main').get().asFile]
} })
def unitCoverageData = files(provider { allprojects.collect { it.layout.buildDirectory.file('jacoco/unitTest.exec').get().asFile } })

tasks.register('unitTestCoverage', JacocoReport) {
    group = 'verification'
    description = 'Cobertura agregada de pruebas unitarias de todos los módulos'
    dependsOn 'unitTest', ':log-audit-consumer-reactive:unitTest'
    classDirectories.from(unitCoverageClasses)
    sourceDirectories.from(unitCoverageSources)
    executionData.from(unitCoverageData)
    reports {
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/unitTest/html')
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/unitTest/unitTestCoverage.xml')
        csv.required = true
        csv.outputLocation = layout.buildDirectory.file('reports/jacoco/unitTest/unitTestCoverage.csv')
    }
}

tasks.register('unitTestCoverageVerification', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Exige al menos 99% de líneas y ramas con pruebas unitarias'
    dependsOn 'unitTestCoverage'
    classDirectories.from(unitCoverageClasses)
    sourceDirectories.from(unitCoverageSources)
    executionData.from(unitCoverageData)
    violationRules {
        rule {
            limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.99 }
            limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = 0.99 }
        }
    }
}

tasks.named('check') { dependsOn 'unitTestCoverageVerification' }
