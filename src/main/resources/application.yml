server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  main:
    web-application-type: reactive
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      datetime:
        adjust-dates-to-context-time-zone: false
        write-dates-as-timestamps: false
  application:
    name: audit-query-monolith
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/lineage_audit?retryWrites=false&serverSelectionTimeoutMS=3000&connectTimeoutMS=3000&socketTimeoutMS=10000}
    database: ${MONGODB_DATABASE:lineage_audit}
app:
  timezone: ${AUDIT_TIMEZONE:America/Lima}
  mongodb:
    collection: ${MONGODB_COLLECTION:tapp_audit_events}

audit:
  api:
    url: ${AUDIT_API_URL:http://localhost:8181/api/v1/audit/security/log}
    connect-timeout: ${AUDIT_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${AUDIT_API_READ_TIMEOUT:10s}

logging:
  level:
    org.mongodb.driver: WARN
